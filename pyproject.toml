[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kefer-contracts"
version = "0.1.0"
description = "Public chart-result interface for Kefer Astrology."
license = "MIT"
license-files = ["LICENSE", "LICENSING.md"]
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["jsonschema>=4.18"]

[tool.setuptools]
packages = ["kefer_contracts", "kefer_contracts.data"]

[tool.setuptools.package-dir]
"kefer_contracts" = "python/kefer_contracts"
"kefer_contracts.data" = "contracts"

[tool.setuptools.package-data]
"kefer_contracts.data" = ["**/*"]
